esp32_ble:
  io_capability: none

bluetooth_proxy:
  active: true
  cache_services: true

binary_sensor:
  - platform: template
    name: "Dev1 Light Power"
    id: dev1_power
    device_class: light
  - platform: template
    name: "Dev1 Fan Running"
    id: dev1_fan_running
    device_class: running
  - platform: template
    name: "Dev2 Light Power"
    id: dev2_power
    device_class: light
  - platform: template
    name: "Dev2 Fan Running"
    id: dev2_fan_running
    device_class: running
  - platform: template
    name: "Dev3 Light Power"
    id: dev3_power
    device_class: light
  - platform: template
    name: "Dev3 Fan Running"
    id: dev3_fan_running
    device_class: running
  - platform: template
    name: "Dev4 Light Power"
    id: dev4_power
    device_class: light
  - platform: template
    name: "Dev4 Fan Running"
    id: dev4_fan_running
    device_class: running

sensor:
  - platform: template
    name: "Dev1 Brightness"
    id: dev1_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev1 Fan Speed"
    id: dev1_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Brightness"
    id: dev2_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Fan Speed"
    id: dev2_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Brightness"
    id: dev3_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Fan Speed"
    id: dev3_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Brightness"
    id: dev4_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Fan Speed"
    id: dev4_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 50ms
    active: false
  on_ble_manufacturer_data_advertise:
    
    # =========================================================
    # 1704 协议 (Dev1, Dev2)
    # 索引：Mode=x[11], 亮度=x[14:15], 档位=x[19]
    # =========================================================
    - manufacturer_id: "06A8"
      then:
        - lambda: |-
            if (x.size() < 20) return;
            
            uint8_t mode = x[11];
            bool light_on = (mode & 0xF0) != 0x00;
            bool fan_on = (mode & 0x01) == 0x01;
            
            uint16_t brt_raw = (x[14] << 8) | x[15];
            int brt_pct = 0;
            if (light_on) {
              if (brt_raw == 0xFFFF || brt_raw == 0xFF7F) brt_pct = 100;
              else brt_pct = (int)(brt_raw / 655.35);
            }
            
            uint8_t fan_gear_raw = x[19];
            int fan_gear = fan_on ? (fan_gear_raw + 1) : 0;
            
            if (x[3]==0xCD && x[4]==0xAB && x[5]==0x38 && x[6]==0x70) {
              id(dev1_power).publish_state(light_on);
              id(dev1_fan_running).publish_state(fan_on);
              id(dev1_fan_speed).publish_state(fan_gear);
              id(dev1_brightness).publish_state(brt_pct);
            }
            else if (x[3]==0x92 && x[4]==0x26 && x[5]==0x35 && x[6]==0x70) {
              id(dev2_power).publish_state(light_on);
              id(dev2_fan_running).publish_state(fan_on);
              id(dev2_fan_speed).publish_state(fan_gear);
              id(dev2_brightness).publish_state(brt_pct);
            }

    # =========================================================
    # 134D 协议 (Dev3, Dev4)
    # 索引：亮度=x[13], Mode=x[18], 档位=x[19]
    # =========================================================
    - manufacturer_id: "134D"
      then:
        - lambda: |-
            if (x.size() < 20) return;
            if (x[0] != 0x21) return;
            
            uint8_t mode = x[18];
            bool light_on = (mode & 0xF0) != 0x00;
            bool fan_on = (mode & 0x01) == 0x01;
            
            uint8_t brt_raw = x[13];
            int brt_pct = light_on ? (int)(brt_raw * 100 / 255) : 0;
            
            uint8_t fan_gear_raw = x[19];
            int fan_gear = fan_on ? (fan_gear_raw + 1) : 0;
            
            if (x[2]==0x48 && x[3]==0x80 && x[4]==0x27 && x[5]==0x70) {
              id(dev3_power).publish_state(light_on);
              id(dev3_fan_running).publish_state(fan_on);
              id(dev3_fan_speed).publish_state(fan_gear);
              id(dev3_brightness).publish_state(brt_pct);
            }
            else if (x[2]==0xF0 && x[3]==0xCF && x[4]==0x2D && x[5]==0x70) {
              id(dev4_power).publish_state(light_on);
              id(dev4_fan_running).publish_state(fan_on);
              id(dev4_fan_speed).publish_state(fan_gear);
              id(dev4_brightness).publish_state(brt_pct);
            }

esp32_ble_server:
  id: ble_server
  manufacturer_data: []
