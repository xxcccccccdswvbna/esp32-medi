esp32_ble:
  io_capability: none

bluetooth_proxy:
  active: true
  cache_services: true

binary_sensor:
  - platform: template
    name: "Dev1 Light Power"
    id: dev1_power
    device_class: light
  - platform: template
    name: "Dev1 Fan Running"
    id: dev1_fan_running
    device_class: running
  - platform: template
    name: "Dev2 Light Power"
    id: dev2_power
    device_class: light
  - platform: template
    name: "Dev2 Fan Running"
    id: dev2_fan_running
    device_class: running
  - platform: template
    name: "Dev3 Light Power"
    id: dev3_power
    device_class: light
  - platform: template
    name: "Dev3 Fan Running"
    id: dev3_fan_running
    device_class: running
  - platform: template
    name: "Dev4 Light Power"
    id: dev4_power
    device_class: light
  - platform: template
    name: "Dev4 Fan Running"
    id: dev4_fan_running
    device_class: running

sensor:
  - platform: template
    name: "Dev1 Brightness"
    id: dev1_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev1 Fan Speed"
    id: dev1_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Brightness"
    id: dev2_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Fan Speed"
    id: dev2_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Brightness"
    id: dev3_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Fan Speed"
    id: dev3_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Brightness"
    id: dev4_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Fan Speed"
    id: dev4_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 50ms
    active: false
  on_ble_manufacturer_data_advertise:
    # 1704 协议 (Dev1, Dev2)
    - manufacturer_id: "06A8"
      then:
        - lambda: |-
            if (x.size() < 19) return;
            if (x[3]==0xCD && x[4]==0xAB && x[5]==0x38 && x[6]==0x70) {
              uint16_t brt_raw = (x[14] << 8) | x[15];
              // 核心修正：0xFFFF 代表关灯，其他值代表开灯
              bool power_on = (brt_raw != 0xFFFF); 
              int brt_pct = 0;
              if (power_on) {
                // 核心修正：0xFF7F 代表 100% 亮度
                brt_pct = (brt_raw == 0xFF7F || brt_raw == 0xFFFF) ? 100 : (int)(brt_raw / 655.35);
              }
              
              uint8_t fan_gear = x[19];
              // 核心修正：如果灯关，风扇也关；如果灯开，x[19]>1 视为风扇开 (排除 0x01 这个特殊值)
              bool fan_running = power_on && (fan_gear > 1); 
              
              id(dev1_power).publish_state(power_on);
              id(dev1_fan_running).publish_state(fan_running);
              id(dev1_fan_speed).publish_state(fan_running ? fan_gear : 0);
              id(dev1_brightness).publish_state(brt_pct);
            }
            else if (x[3]==0x92 && x[4]==0x26 && x[5]==0x35 && x[6]==0x70) {
              uint16_t brt_raw = (x[14] << 8) | x[15];
              bool power_on = (brt_raw != 0xFFFF);
              int brt_pct = 0;
              if (power_on) {
                brt_pct = (brt_raw == 0xFF7F || brt_raw == 0xFFFF) ? 100 : (int)(brt_raw / 655.35);
              }
              uint8_t fan_gear = x[19];
              bool fan_running = power_on && (fan_gear > 1);
              
              id(dev2_power).publish_state(power_on);
              id(dev2_fan_running).publish_state(fan_running);
              id(dev2_fan_speed).publish_state(fan_running ? fan_gear : 0);
              id(dev2_brightness).publish_state(brt_pct);
            }

    # 134D 协议 (Dev3, Dev4)
    - manufacturer_id: "134D"
      then:
        - lambda: |-
            if (x.size() < 19) return;
            if (x[0] != 0x21) return;
            
            if (x[2]==0x48 && x[3]==0x80 && x[4]==0x27 && x[5]==0x70) {
              uint16_t brt_raw = (x[14] << 8) | x[15];
              // 核心修正：0xFFFF 代表关灯
              bool power_on = (brt_raw != 0xFFFF); 
              int brt_pct = 0;
              if (power_on) {
                // 0xFFFA 等接近 FFFF 的值都视为 100%
                brt_pct = (brt_raw > 65000) ? 100 : (int)(brt_raw / 655.35);
              }
              
              // 核心修正：x[18] == 0x00 代表风扇开启 (1档)，其他值 (0x10, 0x20) 代表关
              bool fan_running = (x[18] == 0x00);
              uint8_t fan_gear = fan_running ? (x[19] > 0 ? x[19] : 1) : 0;
              // 如果用户确认 0x05 就是 1档，可以强制映射：if (fan_gear == 5) fan_gear = 1;
              
              id(dev3_power).publish_state(power_on);
              id(dev3_fan_running).publish_state(fan_running);
              id(dev3_fan_speed).publish_state(fan_gear);
              id(dev3_brightness).publish_state(brt_pct);
            }
            else if (x[2]==0xF0 && x[3]==0xCF && x[4]==0x2D && x[5]==0x70) {
              uint16_t brt_raw = (x[14] << 8) | x[15];
              bool power_on = (brt_raw != 0xFFFF);
              int brt_pct = 0;
              if (power_on) {
                brt_pct = (brt_raw > 65000) ? 100 : (int)(brt_raw / 655.35);
              }
              
              bool fan_running = (x[18] == 0x00);
              uint8_t fan_gear = fan_running ? (x[19] > 0 ? x[19] : 1) : 0;
              
              id(dev4_power).publish_state(power_on);
              id(dev4_fan_running).publish_state(fan_running);
              id(dev4_fan_speed).publish_state(fan_gear);
              id(dev4_brightness).publish_state(brt_pct);
            }

esp32_ble_server:
  id: ble_server
  manufacturer_data: []
