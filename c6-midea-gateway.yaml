esphome:
  name: c6-midea-gateway
  friendly_name: "C6 Midea Gateway"
  build_path: build/c6-midea-gateway

# 🔹 硬件基础配置（必须写在主文件）
esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    version: recommended

# =============================================================================
# 🔹 核心：使用 packages 引入模块
# =============================================================================
packages:
  ble: !include includes/ble.yaml
  globals_scripts: !include includes/globals_scripts.yaml
  network: !include includes/network.yaml
  dev1: !include includes/devices/dev1.yaml
  dev2: !include includes/devices/dev2.yaml
  dev3: !include includes/devices/dev3.yaml
  # dev4: !include includes/devices/dev4.yaml  # 需要时取消注释
