esphome:
  name: ble_fan_lights
  platform: ESP32
  board: esp32-s3-devkitc-1

esp32_ble:
  io_capability: NONE

bluetooth_proxy:
  active: true
  cache_services: true

# ===============================
# 模板 binary_sensor
# ===============================
binary_sensor:
  - platform: template
    name: "Dev1 Light Power"
    id: dev1_power
    device_class: light
  - platform: template
    name: "Dev1 Fan Running"
    id: dev1_fan_running
    device_class: running

  - platform: template
    name: "Dev2 Light Power"
    id: dev2_power
    device_class: light
  - platform: template
    name: "Dev2 Fan Running"
    id: dev2_fan_running
    device_class: running

  - platform: template
    name: "Dev3 Light Power"
    id: dev3_power
    device_class: light
  - platform: template
    name: "Dev3 Fan Running"
    id: dev3_fan_running
    device_class: running

  - platform: template
    name: "Dev4 Light Power"
    id: dev4_power
    device_class: light
  - platform: template
    name: "Dev4 Fan Running"
    id: dev4_fan_running
    device_class: running

# ===============================
# 模板 sensor
# ===============================
sensor:
  - platform: template
    name: "Dev1 Brightness"
    id: dev1_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev1 Fan Speed"
    id: dev1_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

  - platform: template
    name: "Dev2 Brightness"
    id: dev2_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Fan Speed"
    id: dev2_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

  - platform: template
    name: "Dev3 Brightness"
    id: dev3_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Fan Speed"
    id: dev3_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

  - platform: template
    name: "Dev4 Brightness"
    id: dev4_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Fan Speed"
    id: dev4_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

# ===============================
# esp32_ble_tracker
# ===============================
esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 50ms
    active: false

  on_ble_manufacturer_data_advertise:
    # =========================================================
    # 8153 v2 风扇灯协议 (Dev1~Dev4)
    # =========================================================
    - manufacturer_id: "8153"
      then:
        - lambda: |-
            if (x.size() < 20) return;

            // MAC 地址
            std::string mac = x.to_string().substr(6,12);

            // mode 字段
            uint8_t mode = x[9];
            bool led_on = mode & 0x01;
            bool fan_running = (mode==0x12)||(mode==0x13)||(mode==0x32)||(mode==0x33);

            // 亮度百分比
            int brightness = int((x[12]/255.0)*100.0);

            // 风扇档位
            int fan_speed = fan_running ? (x[16]+1) : 0;

            // 匹配设备
            if (mac=="7da849700000") {  // Dev1
              id(dev1_power).publish_state(led_on);
              id(dev1_fan_running).publish_state(fan_running);
              id(dev1_fan_speed).publish_state(fan_speed);
              id(dev1_brightness).publish_state(brightness);
            } else if (mac=="922635700000") {  // Dev2
              id(dev2_power).publish_state(led_on);
              id(dev2_fan_running).publish_state(fan_running);
              id(dev2_fan_speed).publish_state(fan_speed);
              id(dev2_brightness).publish_state(brightness);
            } else if (mac=="cdab38700000") {  // Dev3
              id(dev3_power).publish_state(led_on);
              id(dev3_fan_running).publish_state(fan_running);
              id(dev3_fan_speed).publish_state(fan_speed);
              id(dev3_brightness).publish_state(brightness);
            } else if (mac=="f0cf2d700000") {  // Dev4
              id(dev4_power).publish_state(led_on);
              id(dev4_fan_running).publish_state(fan_running);
              id(dev4_fan_speed).publish_state(fan_speed);
              id(dev4_brightness).publish_state(brightness);
            }

esp32_ble_server:
  id: ble_server
  manufacturer_data: []
