esp32_ble:
  io_capability: none

bluetooth_proxy:
  active: true
  cache_services: true

binary_sensor:
  - platform: template
    name: "Dev1 Light Power"
    id: dev1_power
    device_class: light
  - platform: template
    name: "Dev1 Fan Running"
    id: dev1_fan_running
    device_class: running
  - platform: template
    name: "Dev2 Light Power"
    id: dev2_power
    device_class: light
  - platform: template
    name: "Dev2 Fan Running"
    id: dev2_fan_running
    device_class: running
  - platform: template
    name: "Dev3 Light Power"
    id: dev3_power
    device_class: light
  - platform: template
    name: "Dev3 Fan Running"
    id: dev3_fan_running
    device_class: running
  - platform: template
    name: "Dev4 Light Power"
    id: dev4_power
    device_class: light
  - platform: template
    name: "Dev4 Fan Running"
    id: dev4_fan_running
    device_class: running

sensor:
  - platform: template
    name: "Dev1 Brightness"
    id: dev1_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev1 Fan Speed"
    id: dev1_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Brightness"
    id: dev2_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev2 Fan Speed"
    id: dev2_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Brightness"
    id: dev3_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev3 Fan Speed"
    id: dev3_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Brightness"
    id: dev4_brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: template
    name: "Dev4 Fan Speed"
    id: dev4_fan_speed
    unit_of_measurement: "档"
    accuracy_decimals: 0

esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 50ms
    active: false
  on_ble_manufacturer_data_advertise:
    # 修正：必须使用十六进制 "0x06A8"，不能用十进制字符串 "1704"
    - manufacturer_id: "0x06A8"
      then:
        - lambda: |-
            if (x.size() < 19) return; // 降低长度要求，防止丢包
            
            // Dev1: CD AB 38 70
            if (x[3]==0xCD && x[4]==0xAB && x[5]==0x38 && x[6]==0x70) {
              bool power_on = (x[9] > 0);
              uint8_t fan_gear_idx = x[19];
              uint16_t brt_raw = (x[14] << 8) | x[15];
              int brt_pct = (brt_raw == 0xFFFF || brt_raw == 0xFF7F) ? 100 : (int)(brt_raw / 655.35);
              
              id(dev1_power).publish_state(power_on);
              id(dev1_fan_running).publish_state(fan_gear_idx > 0);
              id(dev1_fan_speed).publish_state(fan_gear_idx);
              id(dev1_brightness).publish_state(brt_pct);
            }
            // Dev2: 92 26 35 70
            else if (x[3]==0x92 && x[4]==0x26 && x[5]==0x35 && x[6]==0x70) {
              bool power_on = (x[9] > 0);
              uint8_t fan_gear_idx = x[19];
              uint16_t brt_raw = (x[14] << 8) | x[15];
              int brt_pct = (brt_raw == 0xFFFF || brt_raw == 0xFF7F) ? 100 : (int)(brt_raw / 655.35);
              
              id(dev2_power).publish_state(power_on);
              id(dev2_fan_running).publish_state(fan_gear_idx > 0);
              id(dev2_fan_speed).publish_state(fan_gear_idx);
              id(dev2_brightness).publish_state(brt_pct);
            }

    # 134D 协议 (Dev3, Dev4)
    - manufacturer_id: "0x134D"
      then:
        - lambda: |-
            if (x.size() < 19) return;
            if (x[0] != 0x21) return;
            
            // Dev3: 48 80 27 70
            if (x[2]==0x48 && x[3]==0x80 && x[4]==0x27 && x[5]==0x70) {
              bool power_on = (x[9] == 0x01);
              uint8_t fan_gear_idx = x[19];
              uint16_t brt_raw = (x[14] << 8) | x[15];
              int brt_pct = (brt_raw == 0xFFFF) ? 100 : (int)(brt_raw / 655.35);
              
              id(dev3_power).publish_state(power_on);
              id(dev3_fan_running).publish_state(fan_gear_idx > 0);
              id(dev3_fan_speed).publish_state(fan_gear_idx);
              id(dev3_brightness).publish_state(brt_pct);
            }
            // Dev4: F0 CF 2D 70
            else if (x[2]==0xF0 && x[3]==0xCF && x[4]==0x2D && x[5]==0x70) {
              bool power_on = (x[9] == 0x01);
              uint8_t fan_gear_idx = x[19];
              uint16_t brt_raw = (x[14] << 8) | x[15];
              int brt_pct = (brt_raw == 0xFFFF) ? 100 : (int)(brt_raw / 655.35);
              
              id(dev4_power).publish_state(power_on);
              id(dev4_fan_running).publish_state(fan_gear_idx > 0);
              id(dev4_fan_speed).publish_state(fan_gear_idx);
              id(dev4_brightness).publish_state(brt_pct);
            }

esp32_ble_server:
  id: ble_server
  manufacturer_data: []
