name: Build & Release ESPHome

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.yaml"
      - "**/*.yml"

permissions:
  contents: write

jobs:
  # ── 任务1：检测哪些 YAML 文件被修改 ──────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 检测修改的 YAML 文件
        id: changed
        run: |
          # 获取修改的 yaml 文件列表
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | \
            grep -E '^c6-midea-gateway\.yaml$' | \
            jq -R -s -c 'split("\n")[:-1]')
          
          # 如果没有检测到差异（首次推送），检查所有 yaml
          if [ -z "$FILES" ] || [ "$FILES" = "[]" ]; then
            FILES='["c6-midea-gateway.yaml"]'
          fi
          
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "📝 检测到修改的文件: $FILES"

  # ── 任务2：编译 ESPHome 固件 ────────────────────────────
  build:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        yaml-file: ${{ fromJson(needs.detect.outputs.files) }}
    
    steps:
      - uses: actions/checkout@v4
      
      # 🔐 生成 secrets.yaml（保护敏感信息）
      - name: 生成 secrets.yaml
        if: ${{ secrets.WIFI_SSID != '' }}
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "${{ secrets.WIFI_SSID }}"
          wifi_password: "${{ secrets.WIFI_PASSWORD }}"
          api_encryption_key: "${{ secrets.API_KEY }}"
          ota_password: "${{ secrets.OTA_PASSWORD }}"
          EOF
          echo "✅ secrets.yaml 已生成"
      
      # 🛠️ 编译固件
      - name: 编译 ESPHome
        uses: esphome/build-action@v6
        with:
          yaml-file: ${{ matrix.yaml-file }}
      
      # 📦 收集编译产物
      - name: 收集固件文件
        run: |
          mkdir -p output
          
          # 查找所有生成的 bin 文件
          find .esphome/build -name "*.bin" | while read bin; do
            # 提取设备名称
            DEVICE_NAME=$(basename "$bin" .bin)
            # 复制到 output 目录并重命名
            cp "$bin" "output/${DEVICE_NAME}.bin"
            # 同时复制 manifest.json（用于 Web 安装）
            manifest=$(dirname "$bin")/manifest.json
            if [ -f "$manifest" ]; then
              cp "$manifest" "output/${DEVICE_NAME}_manifest.json"
            fi
          done
          
          # 显示生成的文件
          echo "📦 生成的固件文件:"
          ls -lh output/
      
      # 🏷️ 生成版本号标签
      - name: 生成版本号
        id: version
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          TAG="v${TIMESTAMP}-${SHORT_SHA}"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -n1 | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "✅ 版本号: $TAG"
      
      # 📤 发布到 GitHub Releases
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🔧 ESPHome ${{ steps.version.outputs.tag }}"
          body: |
            ## 📋 编译信息
            
            **提交信息**: ${{ steps.version.outputs.commit_msg }}
            **提交哈希**: `${{ github.sha }}`
            **触发方式**: ${{ github.event_name }}
            **修改文件**: 
            ```yaml
            ${{ matrix.yaml-file }}
            ```
            
            ## 📥 下载说明
            
            - `*.bin` - 完整固件文件（用于首次刷写或 OTA）
            - `*_manifest.json` - Web 安装器配置文件
            
            ## 🚀 刷写方法
            
            ### 方法1: Web 刷写（推荐）
            1. 访问 https://web.esphome.io
            2. 选择对应的 .bin 文件
            3. 连接设备并刷入
            
            ### 方法2: ESPHome Dashboard
            1. 上传 .bin 文件到 ESPHome
            2. 点击 Install
            
            ---
            *🤖 自动生成于 ${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}*
          files: |
            output/*.bin
            output/*_manifest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 任务3：汇总所有编译结果 ────────────────────────────
  summary:
    needs: [detect, build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 显示编译摘要
        run: |
          echo "## 🎉 编译完成"
          echo ""
          echo "**检测到的文件**: ${{ needs.detect.outputs.files }}"
          echo "**编译状态**: ${{ needs.build.result }}"
          echo ""
          echo "✅ 请访问 Releases 页面下载固件"
