name: Build & Release ESPHome

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.yaml"
      - "**/*.yml"

permissions:
  contents: write

jobs:
  # ── 任务1：检测修改的 YAML ──────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 检测修改的 YAML 文件
        id: changed
        run: |
          # 确保 jq 已安装
          sudo apt-get update && sudo apt-get install -y jq
          
          # 获取修改的 yaml 文件列表
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | \
            grep -E 'c6-midea-gateway\.yaml$' | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # 如果没有检测到差异（如首次推送），默认编译主文件
          if [ -z "$FILES" ] || [ "$FILES" = "[]" ]; then
            echo "⚠️ 未检测到变更，默认编译主文件"
            FILES='["c6-midea-gateway.yaml"]'
          fi
          
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "📝 检测到修改的文件: $FILES"

  # ── 任务2：编译 ESPHome 固件 ────────────────────────────
  build:
    needs: detect
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        yaml-file: ${{ fromJson(needs.detect.outputs.files) }}
    
    steps:
      - uses: actions/checkout@v4
      
      # 🔐 生成 secrets.yaml（修复 !secret 找不到的问题）
      - name: 生成 secrets.yaml
        run: |
          echo "正在生成 secrets.yaml..."
          cat > secrets.yaml << EOF
          wifi_ssid: "${{ secrets.WIFI_SSID }}"
          wifi_password: "${{ secrets.WIFI_PASSWORD }}"
          api_encryption_key: "${{ secrets.API_KEY }}"
          ota_password: "${{ secrets.OTA_PASSWORD }}"
          EOF
          echo "✅ secrets.yaml 内容预览:"
          cat secrets.yaml | sed 's/.*/&/;s/./&/g' # 防止密码泄露，只打印结构
          # 实际检查文件是否存在
          ls -l secrets.yaml

      # 🛠️ 编译固件
      - name: 编译 ESPHome
        uses: esphome/build-action@v6
        with:
          yaml-file: ${{ matrix.yaml-file }}
          version: latest  # 确保使用最新稳定版 ESPHome
      
      # 📦 收集编译产物
      - name: 收集固件文件
        run: |
          mkdir -p output
          echo "🔍 查找编译产物..."
          find .esphome/build -name "*.bin" -type f
          
          # 复制 bin 和 manifest
          find .esphome/build -name "*.bin" -exec cp {} output/ \;
          find .esphome/build -name "manifest.json" -exec cp {} output/ \;
          
          echo "📦 最终输出文件:"
          ls -lh output/

      # 🏷️ 生成版本号
      - name: 生成版本号
        id: version
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          TAG="v${TIMESTAMP}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 📤 发布到 GitHub Releases
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "🔧 ESPHome ${{ steps.version.outputs.tag }}"
          body: |
            ## 📋 编译信息
            **提交哈希**: `${{ github.sha }}`
            **修改文件**: `${{ matrix.yaml-file }}`
            
            ## 📥 刷写方法
            1. 访问 https://web.esphome.io
            2. 选择 `firmware.bin` (或对应的 .bin 文件)
            3. 连接设备并刷入
          files: |
            output/*.bin
            output/manifest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: false  # 即使没找到文件也不报错，方便排查
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
