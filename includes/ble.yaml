# =============================================================================
# 🔹 BLE 基础栈
# =============================================================================
esp32_ble:
  io_capability: none

bluetooth_proxy:
  active: true
  cache_services: true

# =============================================================================
# 🔹 原始数据接收器（4 个设备，每个对应一个 text_sensor）
# =============================================================================
text_sensor:
  - platform: template
    name: "BLE Raw Dev1"
    id: dev1_raw_hex
  - platform: template
    name: "BLE Raw Dev2"
    id: dev2_raw_hex
  - platform: template
    name: "BLE Raw Dev3"
    id: dev3_raw_hex
  - platform: template
    name: "BLE Raw Dev4"
    id: dev4_raw_hex

# =============================================================================
# 🔹 BLE 扫描（仅做 Hex 转换 + 路由分发，不做协议解析）
# =============================================================================
esp32_ble_tracker:
  scan_parameters:
    interval: 1000ms
    window: 50ms
    active: false
  
  # ── 监听 1704 (0x06A8)：Dev1, Dev2 ─────────────────────────
  on_ble_manufacturer_data_advertise:
    - manufacturer_id: "1704"
      then:
        - lambda: |-
            // 极简 Hex 转换（纯查表，ESP32 负载 <0.1%）
            std::string hex;
            hex.reserve(x.size() * 2);
            static const char h[] = "0123456789abcdef";
            for (uint8_t b : x) {
              hex += h[b >> 4];
              hex += h[b & 0x0F];
            }
            if (x.size() < 8) return;
            
            // Dev1: CD AB 38 70
            if (x[2]==0xCD && x[3]==0xAB && x[4]==0x38 && x[5]==0x70) {
              id(dev1_raw_hex).publish_state(hex);
            }
            // Dev2: 92 26 35 70
            else if (x[2]==0x92 && x[3]==0x26 && x[4]==0x35 && x[5]==0x70) {
              id(dev2_raw_hex).publish_state(hex);
            }

    # ── 监听 4941 (0x134D)：Dev3, Dev4 ─────────────────────────
    - manufacturer_id: "134D"
      then:
        - lambda: |-
            std::string hex;
            hex.reserve(x.size() * 2);
            static const char h[] = "0123456789abcdef";
            for (uint8_t b : x) {
              hex += h[b >> 4];
              hex += h[b & 0x0F];
            }
            if (x.size() < 8) return;
            
            // Dev3: 48 80 27 70
            if (x[2]==0x48 && x[3]==0x80 && x[4]==0x27 && x[5]==0x70) {
              id(dev3_raw_hex).publish_state(hex);
            }
            // Dev4: F0 CF 2D 70
            else if (x[2]==0xF0 && x[3]==0xCF && x[4]==0x2D && x[5]==0x70) {
              id(dev4_raw_hex).publish_state(hex);
            }

# =============================================================================
# 🔹 BLE 广播服务器（发送控制指令，保持不变）
# =============================================================================
esp32_ble_server:
  id: ble_server
  manufacturer_data: []
